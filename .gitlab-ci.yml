image: alpine:latest

create-pages:
  script:
    - mkdir public
    - cp -r Arabic public/
    - cp -r ./*.html public/ 2>/dev/null || true
    - cp -r ./*.css public/ 2>/dev/null || true
    - cp -r ./*.js public/ 2>/dev/null || true

  pages:
    publish: public

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'